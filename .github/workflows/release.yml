name: Release (Unsigned DMG)

# No Apple Developer account: the app is ad-hoc signed (runs locally after
# right-click → Open). This mirrors exactly how a local Release build is made:
# xcodebuild with ad-hoc identity + explicit codesign, then a plain DMG.
on:
  workflow_dispatch:
  push:
    tags:
      - "v*"

jobs:
  build:
    runs-on: macos-26
    permissions:
      contents: write
    env:
      APP_NAME: BetterOSD
      SCHEME: BetterOSD
      CONFIGURATION: Release
      DERIVED_DATA_PATH: ${{ github.workspace }}/build/DerivedData
      APP_PATH: ${{ github.workspace }}/build/DerivedData/Build/Products/Release/BetterOSD.app
      DMG_PATH: ${{ github.workspace }}/build/BetterOSD-arm64.dmg
      UPDATES_DIR: ${{ github.workspace }}/build/updates
      # Sparkle is repointed at this fork's own feed at build time ONLY —
      # the Info.plist in git stays identical to upstream so PRs apply
      # cleanly. Without this, fork users would eventually be auto-updated
      # back to the upstream build and lose the fork's features.
      FORK_FEED_URL: https://github.com/0x3654/better-osd/releases/latest/download/appcast.xml
      # Public half of the fork's Sparkle Ed25519 key; the private half lives
      # in the SPARKLE_ED25519_KEY repo secret.
      FORK_SPARKLE_PUBKEY: kvoXC3Z8MV+p/bFliauIU9KLKE5KuurSGz0WR63legM=
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Xcode version
        run: xcodebuild -version

      - name: Repoint Sparkle feed at this fork
        run: |
          set -euo pipefail
          plutil -replace SUFeedURL -string "$FORK_FEED_URL" BetterOSD/Info.plist
          plutil -replace SUPublicEDKey -string "$FORK_SPARKLE_PUBKEY" BetterOSD/Info.plist

      - name: Build (ad-hoc, no Developer ID)
        run: |
          xcodebuild \
            -scheme "$SCHEME" \
            -configuration "$CONFIGURATION" \
            -destination "generic/platform=macOS" \
            -derivedDataPath "$DERIVED_DATA_PATH" \
            CODE_SIGN_STYLE=Manual \
            CODE_SIGN_IDENTITY=- \
            CODE_SIGNING_REQUIRED=NO \
            PROVISIONING_PROFILE_SPECIFIER="" \
            ARCHS=arm64 \
            ONLY_ACTIVE_ARCH=YES \
            build

      - name: Ad-hoc sign and verify
        run: |
          set -euo pipefail
          codesign --force --sign - --deep "$APP_PATH"
          codesign --verify --strict --verbose=2 "$APP_PATH"

      - name: Create DMG
        run: |
          set -euo pipefail
          rm -rf "${{ github.workspace }}/build/dmg"
          mkdir -p "${{ github.workspace }}/build/dmg"
          ditto "$APP_PATH" "${{ github.workspace }}/build/dmg/${{ env.APP_NAME }}.app"
          # The copy must still pass strict verification before it goes into the DMG.
          codesign --verify --strict "${{ github.workspace }}/build/dmg/${{ env.APP_NAME }}.app"
          ln -s /Applications "${{ github.workspace }}/build/dmg/Applications"
          hdiutil create -volname "$APP_NAME" -srcfolder "${{ github.workspace }}/build/dmg" -ov -format UDZO "$DMG_PATH"

      - name: Upload DMG artifact
        uses: actions/upload-artifact@v4
        with:
          name: BetterOSD-arm64-dmg
          path: "${{ env.DMG_PATH }}"

      - name: Generate Sparkle appcast
        if: startsWith(github.ref, 'refs/tags/v')
        env:
          SPARKLE_ED25519_KEY: ${{ secrets.SPARKLE_ED25519_KEY }}
        run: |
          set -euo pipefail
          SPARKLE_BIN="$DERIVED_DATA_PATH/SourcePackages/artifacts/sparkle/Sparkle/bin"
          mkdir -p "$UPDATES_DIR"
          cp "$DMG_PATH" "$UPDATES_DIR/"
          printf '%s' "$SPARKLE_ED25519_KEY" | "$SPARKLE_BIN/generate_appcast" \
            --ed-key-file - \
            --download-url-prefix "https://github.com/0x3654/better-osd/releases/download/${{ github.ref_name }}/" \
            "$UPDATES_DIR"

      - name: Publish GitHub Release
        if: startsWith(github.ref, 'refs/tags/v')
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          shopt -s nullglob
          assets=("$DMG_PATH" "$UPDATES_DIR/appcast.xml" "$UPDATES_DIR"/*.delta)
          gh release create "${{ github.ref_name }}" "${assets[@]}" --generate-notes
